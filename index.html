<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesh Roma IT - Mappa Live</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #1a1a1a; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <!-- La tua mappa PotatoMesh alimentata da Ngrok -->
    <iframe id="map-frame" src="https://ngrok-free.dev" allow="geolocation"></iframe>

    <script>
        // Forza il browser dello smartphone a rinfrescare i dati ogni 15 secondi
        setInterval(function() {
            var iframe = document.getElementById('map-frame');
            iframe.src = iframe.src;
        }, 15000); 
    </script>

</body>
</html>
