<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeshRoma - Sezione Alto Lazio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 90%;
        }
        .logo-container {
            width: 100%;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
        }
        .logo-banner {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            border: none;
            outline: none;
        }
        h1 {
            color: #0b3c5d;
            font-size: 2.2rem;
            margin-bottom: 5px;
        }
        .tech-info {
            background-color: #f0f4f8;
            color: #244f6b;
            font-size: 1rem;
            font-weight: 600;
            padding: 8px 15px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 20px;
            border-left: 4px solid #328cc1;
        }
        p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-mappa {
            display: inline-block;
            background-color: #328cc1;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 6px;
            transition: background 0.3s;
        }
        .btn-mappa:hover {
            background-color: #0b3c5d;
        }
        /* Stile per il contatore di visite */
        .counter-container {
            margin-top: 35px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-size: 0.9rem;
            color: #777;
        }
        .counter-container img {
            vertical-align: middle;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <!-- Nota: Ricordati di inserire qui i tag di apertura/chiusura del container e gli elementi mancanti nel tuo frammento iniziale se non presenti nel file originale -->
    <div class="container">
        <!-- Sezione Contatore Accessi -->
        <div class="counter-container">
            <span>Visite totali:</span>
            <img src="https://seeyoufarm.com" alt="Contatore visite"/>
        </div>
    </div>

</body>
</html>
