<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesh Roma IT - Mappa Live</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #1a1a1a; font-family: Arial, sans-serif; }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* Pannello trasparente per il contatore in basso a destra */
        #counter-widget {
            position: fixed;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #444;
            color: #fff;
            font-size: 11px;
            text-align: center;
            z-index: 9999;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #counter-widget img {
            margin-top: 3px;
            display: block;
        }
    </style>
</head>
<body>

    <!-- La tua mappa PotatoMesh -->
    <iframe src="https://loca.lt" allow="geolocation"></iframe>

    <!-- Widget Contatore di Accessi -->
    <div id="counter-widget">
        <span>VISITATORI</span>
        <!-- Codice del contatore grafico gratuito -->
        <img src="https://hitwebcounter.com" title="Counter" Alt="Visitatori Mesh" border="0" />
    </div>

</body>
</html>
